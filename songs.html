<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习曲目 | 吉他学习指南</title>
  <meta name="description" content="经典流行歌曲的和弦谱，分级练习，满足不同水平需求">
  <link rel="stylesheet" href="css/style.css?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .songs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1.5rem;
      padding: 0 2rem;
      max-width: 1600px;
      margin: 0 auto;
      align-items: start; /* 关键：每个卡片保持自己的高度，不延伸填充整个行 */
    }
    
    .song-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition-normal);
      backdrop-filter: blur(20px);
      cursor: pointer;
      align-self: start; /* 关键：卡片不延伸填充行高度 */
    }
    
    .song-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 107, 53, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    
    .song-card.expanded {
      /* Only expand height, not width - stay in grid */
      cursor: default;
    }
    
    .song-header {
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--glass-border);
    }
    
    .song-title-group {
      flex: 1;
    }
    
    .song-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: var(--text-primary);
    }
    
    .song-artist {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .song-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }
    
    .song-badge {
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-xl);
      font-size: 0.75rem;
      font-weight: 600;
    }
    
    .song-badge.key {
      background: rgba(255, 107, 53, 0.2);
      color: var(--accent-secondary);
      border: 1px solid rgba(255, 107, 53, 0.3);
    }
    
    .song-badge.difficulty {
      background: var(--bg-secondary);
      color: var(--text-secondary);
    }
    
    .song-chords {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: flex-end;
    }
    
    .chord-tag {
      padding: 0.3rem 0.6rem;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    
    .song-body {
      padding: 1.5rem;
    }
    
    .strumming-pattern {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    
    .strumming-pattern label {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    
    .strumming-pattern span {
      font-weight: 600;
      color: var(--accent-secondary);
    }
    
    .song-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height var(--transition-slow);
    }
    
    .song-card.expanded .song-details {
      max-height: 2000px;
    }
    
    .chord-sheet {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      font-family: 'Fira Code', monospace;
      overflow-x: auto;
    }
    
    .chord-line {
      color: var(--accent-secondary);
      font-weight: 700;
      white-space: pre;
      line-height: 1.5;
    }
    
    .lyric-line {
      color: var(--text-primary);
      white-space: pre;
      margin-bottom: 0.75rem;
    }
    
    .tips-box {
      background: rgba(255, 107, 53, 0.1);
      border-left: 3px solid var(--accent-primary);
      padding: 1rem;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin-top: 1rem;
    }
    
    .tips-box-title {
      font-weight: 700;
      color: var(--accent-secondary);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    
    .status-message {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    
    @media (max-width: 768px) {
      .songs-grid {
        grid-template-columns: 1fr;
        padding: 0 1rem;
      }
      
      .song-header {
        flex-direction: column;
        gap: 1rem;
      }
      
      .song-chords {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <!-- Page Content -->
  <div class="page-content">
    <!-- Page Header -->
    <div class="page-header">
      <span class="section-tag">实践应用</span>
      <h1 class="page-title">练习<span>曲目</span></h1>
      <p class="section-desc">
        经典流行歌曲的和弦谱，分级练习，从入门到进阶
      </p>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">全部</button>
      <button class="filter-tab" data-filter="1">入门</button>
      <button class="filter-tab" data-filter="2">简单</button>
      <button class="filter-tab" data-filter="3">中等</button>
      <button class="filter-tab" data-filter="4">进阶</button>
      <button class="filter-tab" data-filter="5">挑战</button>
    </div>

    <!-- Songs Grid -->
    <div class="songs-grid" id="songsGrid">
      <div class="status-message">加载中...</div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 吉他学习指南. All rights reserved. 🎸</p>
  </footer>

  <script src="js/nav.js?v=5"></script>
  <script>
    (function() {
      var grid = document.getElementById('songsGrid');
      var filterTabs = document.getElementById('filterTabs');
      var currentFilter = 'all';
      var songsData = [];
      var expandedCard = null;

      // Load songs data
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'data/songs.json', true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            songsData = data.songs || [];
            renderSongs();
          } catch (e) {
            grid.innerHTML = '<div class="status-message">无法加载歌曲数据</div>';
          }
        }
      };
      xhr.send();

      // Filter tabs
      filterTabs.addEventListener('click', function(e) {
        if (e.target.classList.contains('filter-tab')) {
          document.querySelectorAll('.filter-tab').forEach(function(tab) {
            tab.classList.remove('active');
          });
          e.target.classList.add('active');
          currentFilter = e.target.dataset.filter;
          renderSongs();
        }
      });

      function renderSongs() {
        var filtered = currentFilter === 'all' 
          ? songsData 
          : songsData.filter(function(s) {
              return String(s.difficulty) === currentFilter;
            });

        if (filtered.length === 0) {
          grid.innerHTML = '<div class="status-message">暂无数据</div>';
          return;
        }

        grid.innerHTML = '';
        filtered.forEach(function(song, index) {
          var card = createSongCard(song, index);
          grid.appendChild(card);
        });
      }

      function createSongCard(song, index) {
        var card = document.createElement('div');
        card.className = 'song-card';
        card.dataset.index = index;

        var difficultyColors = {
          1: '#2ec4b6',
          2: '#457b9d', 
          3: '#f7931e',
          4: '#ff6b35',
          5: '#e63946'
        };
        var difficultyColor = difficultyColors[song.difficulty] || '#666';

        card.innerHTML = 
          '<div class="song-header">' +
            '<div class="song-title-group">' +
              '<div class="song-title">' + escapeHtml(song.title) + '</div>' +
              '<div class="song-artist">' + escapeHtml(song.artist) + '</div>' +
              '<div class="song-meta">' +
                '<span class="song-badge key">' + escapeHtml(song.key) + '</span>' +
                '<span class="song-badge difficulty" style="background: ' + difficultyColor + '20; color: ' + difficultyColor + ';">' + 
                  escapeHtml(song.difficultyLabel || '难度 ' + song.difficulty) + 
                '</span>' +
                '<span class="song-badge difficulty">' + song.bpm + ' BPM</span>' +
              '</div>' +
            '</div>' +
            '<div class="song-chords">' +
              (song.chords || []).slice(0, 4).map(function(chord) {
                return '<span class="chord-tag">' + escapeHtml(chord) + '</span>';
              }).join('') +
              ((song.chords || []).length > 4 ? '<span class="chord-tag">+' + ((song.chords || []).length - 4) + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="song-body">' +
            '<div class="strumming-pattern">' +
              '<label>扫弦节奏</label>' +
              '<span>' + escapeHtml(song.strumming || '下 下上 上下上') + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="song-details">' +
            '<div style="padding: 0 1.5rem 1.5rem;">' +
              '<div class="chord-sheet" id="chordsheet-' + index + '"></div>' +
              '<div class="tips-box">' +
                '<div class="tips-box-title">练习提示</div>' +
                escapeHtml(song.tips || '暂无提示') +
              '</div>' +
            '</div>' +
          '</div>';

        card.addEventListener('click', function(e) {
          // Toggle current card independently (don't close others)
          card.classList.toggle('expanded');

          if (card.classList.contains('expanded')) {
            renderChordSheet(song, 'chordsheet-' + index);
          }
        });

        return card;
      }

      function renderChordSheet(song, containerId) {
        var container = document.getElementById(containerId);
        if (!container) return;

        var html = '';
        (song.chordLyrics || []).forEach(function(line) {
          var text = line.line;
          var chordLine = '';
          var lyricLine = '';
          var i = 0;
          
          while (i < text.length) {
            if (text[i] === '[') {
              var end = text.indexOf(']', i);
              if (end === -1) break;
              var chord = text.substring(i + 1, end);
              while (chordLine.length < lyricLine.length) {
                chordLine += ' ';
              }
              chordLine += chord;
              i = end + 1;
            } else {
              lyricLine += text[i];
              i++;
            }
          }
          
          while (chordLine.length < lyricLine.length) {
            chordLine += ' ';
          }
          
          html += '<div class="chord-line">' + escapeHtml(chordLine) + '</div>';
          html += '<div class="lyric-line">' + escapeHtml(lyricLine) + '</div>';
        });
        
        container.innerHTML = html || '暂无和弦谱数据';
      }

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
