<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习曲 | 学吉他</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* --- Songs Page Styles --- */
    .songs-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px 48px;
    }

    .songs-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    /* --- Search & Filter Bar --- */
    .songs-controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 0 16px;
      transition: border-color var(--transition);
    }

    .search-box:focus-within {
      border-color: var(--accent);
    }

    .search-box .search-icon {
      font-size: 1.1rem;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .search-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 1rem;
      padding: 14px 0;
      font-family: inherit;
    }

    .search-box input::placeholder {
      color: var(--text-secondary);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      padding: 8px 20px;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      background: var(--card-bg);
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* --- Songs Grid --- */
    .songs-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .song-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      transition: transform var(--transition), box-shadow var(--transition);
      cursor: pointer;
    }

    .song-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .song-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .song-card-header .song-title-area {
      flex: 1;
      min-width: 0;
    }

    .song-card-header .song-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .song-card-header .song-artist {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .song-card-header .song-difficulty {
      flex-shrink: 0;
      margin-left: 12px;
      text-align: right;
    }

    .song-card-header .difficulty-stars {
      font-size: 1rem;
      color: #f0a030;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .song-card-header .difficulty-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .song-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .song-card-meta .chord-tag {
      display: inline-block;
      background: rgba(230, 57, 70, 0.12);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 8px;
    }

    .song-card-meta .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .song-card-meta .meta-item .meta-label {
      font-weight: 500;
    }

    /* --- Expandable Details --- */
    .song-card-details {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
    }

    .song-card.expanded .song-card-details {
      display: block;
      animation: fadeSlideIn 0.25s ease;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .song-card-details .detail-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .song-card-details .detail-tips {
      font-size: 0.95rem;
      color: var(--text-primary);
      line-height: 1.7;
      margin-bottom: 12px;
      padding: 12px 16px;
      background: rgba(230, 57, 70, 0.06);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    .song-card-details .detail-lyrics {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-style: italic;
      line-height: 1.6;
      padding: 10px 16px;
      background: var(--bg-secondary);
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .song-card-details .detail-lyrics::before {
      content: "\201C";
      font-size: 1.4rem;
      color: var(--accent);
      margin-right: 4px;
    }

    .song-card-details .detail-lyrics::after {
      content: "\201D";
      font-size: 1.4rem;
      color: var(--accent);
      margin-left: 4px;
    }

    /* --- TAB Styles --- */
    .tab-section {
      margin-bottom: 14px;
    }

    .tab-section-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .tab-container {
      background: #0d0d0d;
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
    }

    .tab-container pre {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.4;
      color: #e0e0e0;
      white-space: pre;
      letter-spacing: 0;
    }

    .tab-toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      padding: 4px 0;
      user-select: none;
    }

    .tab-toggle-label:hover {
      opacity: 0.8;
    }

    .tab-section.collapsed .tab-container {
      display: none;
    }

    .expand-hint {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 500;
      transition: transform var(--transition);
    }

    .song-card.expanded .expand-hint {
      display: none;
    }

    .song-card .expand-hint:hover {
      transform: translateX(4px);
    }

    /* --- Empty state --- */
    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .no-results .no-results-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      display: block;
    }

    .no-results p {
      font-size: 1.1rem;
    }

    /* --- Responsive --- */
    @media (min-width: 600px) {
      .songs-controls {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      .search-box {
        flex: 0 0 320px;
      }

      .songs-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }
    }

    @media (min-width: 900px) {
      .songs-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
    }

    @media (max-width: 767px) {
      .songs-container {
        padding: 0 12px 36px;
      }

      .song-card {
        padding: 16px;
      }

      .song-card-header .song-title {
        font-size: 1.05rem;
      }

      .filter-btn {
        padding: 6px 14px;
        font-size: 0.82rem;
      }

      .tab-container pre {
        font-size: 11px;
      }
    }
  </style>
</head>

  <!-- ===== Page Content ===== -->
  <div class="page-content">

    <!-- Page Header -->
    <header class="page-header">
      <h1>🎶 练习曲</h1>
      <p>边学边弹，在歌曲中进步</p>
    </header>

    <!-- Songs Section -->
    <div id="songs-app" class="songs-container">
      <div class="songs-loading">🎸 加载乐谱中...</div>
    </div>

  <!-- ===== Scripts ===== -->
  <script src="js/nav.js?v=2"></script>

  <!-- Songs App Logic -->
  <script>
    (function () {
      'use strict';

      var appEl = document.getElementById('songs-app');
      var songs = [];
      var currentFilter = 'all';
      var currentSearch = '';

      var DIFFICULTY_LABELS = {
        '1': '入门',
        '2': '简单',
        '3': '中等',
        '4': '进阶',
        '5': '挑战'
      };

      var FILTER_BUTTONS = [
        { key: 'all', label: '全部' },
        { key: '1', label: '入门' },
        { key: '2', label: '简单' },
        { key: '3', label: '中等' },
        { key: '4', label: '进阶' },
        { key: '5', label: '挑战' }
      ];

      // --- Fetch songs data from JSON ---
      function loadSongs(callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'data/songs.json', true);
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              try {
                var data = JSON.parse(xhr.responseText);
                songs = (data.songs || []).slice();
                songs.sort(function (a, b) {
                  return a.difficulty - b.difficulty;
                });
                callback();
              } catch (e) {
                appEl.innerHTML = '<div class="no-results"><p>乐谱数据加载失败</p></div>';
              }
            } else {
              appEl.innerHTML = '<div class="no-results"><p>无法加载乐谱数据</p></div>';
            }
          }
        };
        xhr.send();
      }

      // --- Build UI ---
      function buildUI() {
        appEl.innerHTML = '';

        // Controls
        var controls = document.createElement('div');
        controls.className = 'songs-controls';

        // Search box
        var searchBox = document.createElement('div');
        searchBox.className = 'search-box';
        searchBox.innerHTML =
          '<span class="search-icon">&#128269;</span>' +
          '<input type="text" id="songSearch" placeholder="搜索歌曲名或艺人..." value="' +
          escapeHtml(currentSearch) + '">';
        controls.appendChild(searchBox);

        // Filter group
        var filterGroup = document.createElement('div');
        filterGroup.className = 'filter-group';

        FILTER_BUTTONS.forEach(function (btn) {
          var btnEl = document.createElement('button');
          btnEl.className = 'filter-btn' + (btn.key === currentFilter ? ' active' : '');
          btnEl.textContent = btn.label;
          btnEl.dataset.filterKey = btn.key;
          btnEl.addEventListener('click', function () {
            currentFilter = btn.key;
            renderSongs();
          });
          filterGroup.appendChild(btnEl);
        });

        controls.appendChild(filterGroup);
        appEl.appendChild(controls);

        // Grid
        var grid = document.createElement('div');
        grid.id = 'songsGrid';
        grid.className = 'songs-grid';
        appEl.appendChild(grid);

        // Search input handler
        var searchInput = document.getElementById('songSearch');
        searchInput.addEventListener('input', function () {
          currentSearch = this.value.trim();
          renderSongs();
        });

        // Render
        renderSongs();
      }

      // --- Render songs based on filter & search ---
      function renderSongs() {
        var grid = document.getElementById('songsGrid');
        if (!grid) return;

        // Update active filter button
        var filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(function (btn) {
          btn.classList.toggle('active', btn.dataset.filterKey === currentFilter);
        });

        // Filter
        var filtered = songs.filter(function (song) {
          if (currentFilter !== 'all') {
            if (String(song.difficulty) !== currentFilter) return false;
          }
          if (currentSearch) {
            var q = currentSearch.toLowerCase();
            var titleMatch = song.title.toLowerCase().indexOf(q) !== -1;
            var artistMatch = song.artist.toLowerCase().indexOf(q) !== -1;
            if (!titleMatch && !artistMatch) return false;
          }
          return true;
        });

        grid.innerHTML = '';

        if (filtered.length === 0) {
          grid.innerHTML =
            '<div class="no-results">' +
            '<span class="no-results-icon">&#127926;</span>' +
            '<p>没有找到匹配的歌曲</p>' +
            '</div>';
          return;
        }

        filtered.forEach(function (song) {
          var card = createSongCard(song);
          grid.appendChild(card);
        });
      }

      // --- Create a song card ---
      function createSongCard(song) {
        var card = document.createElement('div');
        card.className = 'song-card';
        card.dataset.songId = song.id;

        // Stars
        var stars = '';
        for (var i = 0; i < song.difficulty; i++) {
          stars += '\u2605';
        }
        for (var j = song.difficulty; j < 5; j++) {
          stars += '\u2606';
        }

        // Header
        var header = document.createElement('div');
        header.className = 'song-card-header';
        header.innerHTML =
          '<div class="song-title-area">' +
          '<div class="song-title">' + escapeHtml(song.title) + '</div>' +
          '<div class="song-artist">' + escapeHtml(song.artist) + '</div>' +
          '</div>' +
          '<div class="song-difficulty">' +
          '<div class="difficulty-stars">' + stars + '</div>' +
          '<div class="difficulty-label">' + escapeHtml(song.difficultyLabel) + '</div>' +
          '</div>';

        card.appendChild(header);

        // Meta: chords, strumming, bpm
        var meta = document.createElement('div');
        meta.className = 'song-card-meta';

        song.chords.forEach(function (chord) {
          var tag = document.createElement('span');
          tag.className = 'chord-tag';
          tag.textContent = chord;
          meta.appendChild(tag);
        });

        var strumItem = document.createElement('span');
        strumItem.className = 'meta-item';
        strumItem.innerHTML = '<span class="meta-label">&#9835;</span> ' + escapeHtml(song.strumming);
        meta.appendChild(strumItem);

        var bpmItem = document.createElement('span');
        bpmItem.className = 'meta-item';
        bpmItem.innerHTML = '<span class="meta-label">&#9201;</span> ' + song.bpm + ' BPM';
        meta.appendChild(bpmItem);

        card.appendChild(meta);

        // Expand hint
        var hint = document.createElement('div');
        hint.className = 'expand-hint';
        hint.textContent = '点击展开乐谱 \u2192';
        card.appendChild(hint);

        // Expandable details
        var details = document.createElement('div');
        details.className = 'song-card-details';

        // --- Tab Section ---
        if (song.tab && song.tab.length > 0) {
          song.tab.forEach(function (tabSection, idx) {
            var secDiv = document.createElement('div');
            secDiv.className = 'tab-section';

            var secTitle = document.createElement('div');
            secTitle.className = 'tab-section-title';
            secTitle.innerHTML = '&#127928; ' + escapeHtml(tabSection.section);
            secDiv.appendChild(secTitle);

            var tabContainer = document.createElement('div');
            tabContainer.className = 'tab-container';

            var pre = document.createElement('pre');
            pre.textContent = tabSection.lines.join('\n');
            tabContainer.appendChild(pre);
            secDiv.appendChild(tabContainer);

            details.appendChild(secDiv);
          });
        } else {
          // No tab data — show placeholder
          var noTab = document.createElement('div');
          noTab.className = 'tab-section';
          noTab.innerHTML = '<div class="tab-section-title" style="color:var(--text-secondary);opacity:0.7;">&#127928; 乐谱数据加载中，稍后将更新</div>';
          details.appendChild(noTab);
        }

        // --- Tips ---
        var tipsLabel = document.createElement('div');
        tipsLabel.className = 'detail-label';
        tipsLabel.textContent = '\uD83D\uDCA1 练习提示';
        details.appendChild(tipsLabel);

        var tipsDiv = document.createElement('div');
        tipsDiv.className = 'detail-tips';
        tipsDiv.textContent = song.tips;
        details.appendChild(tipsDiv);

        // --- Lyrics ---
        if (song.lyrics_snippet) {
          var lyricsLabel = document.createElement('div');
          lyricsLabel.className = 'detail-label';
          lyricsLabel.textContent = '\uD83C\uDFB5 歌词片段';
          details.appendChild(lyricsLabel);

          var lyricsDiv = document.createElement('div');
          lyricsDiv.className = 'detail-lyrics';
          lyricsDiv.textContent = song.lyrics_snippet;
          details.appendChild(lyricsDiv);
        }

        card.appendChild(details);

        // Click to toggle
        card.addEventListener('click', function (e) {
          if (e.target.tagName === 'INPUT') return;
          this.classList.toggle('expanded');
        });

        return card;
      }

      // --- Simple escape HTML ---
      function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }

      // --- Init ---
      loadSongs(function () {
        buildUI();
      });

    })();
  </script>

</body>
