<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音阶图 | 吉他学习指南</title>
  <meta name="description" content="五声、自然、和声小调等常用音阶，配合音频播放功能，可视化指板图">
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .scales-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 1.5rem;
      padding: 0 2rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    
    .scale-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition-normal);
      backdrop-filter: blur(20px);
    }
    
    .scale-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 107, 53, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    
    .scale-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .scale-title-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .scale-icon {
      width: 48px;
      height: 48px;
      background: var(--gradient-primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    
    .scale-name {
      font-size: 1.2rem;
      font-weight: 700;
    }
    
    .scale-name span {
      display: block;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-muted);
    }
    
    .scale-type {
      padding: 0.3rem 0.8rem;
      background: rgba(255, 107, 53, 0.2);
      border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: var(--radius-xl);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-secondary);
    }
    
    .scale-body {
      padding: 1.5rem;
    }
    
    .scale-notes {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    
    .note-badge {
      padding: 0.5rem 1rem;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      transition: var(--transition-fast);
    }
    
    .note-badge:hover {
      background: rgba(255, 107, 53, 0.2);
      border: 1px solid rgba(255, 107, 53, 0.3);
      color: var(--accent-secondary);
    }
    
    .note-badge.root {
      background: rgba(255, 107, 53, 0.2);
      border: 1px solid rgba(255, 107, 53, 0.3);
      color: var(--accent-secondary);
    }
    
    .fretboard-container {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1rem;
      overflow-x: auto;
    }
    
    .audio-controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    
    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--gradient-primary);
      border: none;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-fast);
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
    }
    
    .play-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.6);
    }
    
    .play-label {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .status-message {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    
    @media (max-width: 768px) {
      .scales-grid {
        grid-template-columns: 1fr;
        padding: 0 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Page Content -->
  <div class="page-content">
    <!-- Page Header -->
    <div class="page-header">
      <span class="section-tag">基础内容</span>
      <h1 class="page-title">音阶<span>图</span></h1>
      <p class="section-desc">
        常用吉他音阶的指板图和音颙播放，帮助你理解音阶的结构
      </p>
    </div>

    <!-- Scales Grid -->
    <div class="scales-grid" id="scalesGrid">
      <div class="status-message">加载中...</div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 吉他学习指南. All rights reserved. 🎸</p>
  </footer>

  <script src="js/nav.js?v=3"></script>
  <script src="js/fretboard-renderer.js"></script>
  <script>
    (function() {
      var grid = document.getElementById('scalesGrid');
      var audioCtx = null;

      // Scale data
      var scalesData = [
        {
          id: 'pentatonic-minor',
          name: 'A 小调五声音阶',
          enName: 'A Minor Pentatonic',
          type: '五声音阶',
          notes: ['A', 'C', 'D', 'E', 'G'],
          intervals: ['1', '♭3', '4', '5', '♭7'],
          pattern: [
            {string: 0, fret: 5, label: 'R', color: '#e63946'},
            {string: 0, fret: 8, label: '♭3', color: '#457b9d'},
            {string: 1, fret: 5, label: '4', color: '#2ec4b6'},
            {string: 1, fret: 7, label: '5', color: '#ff9f1c'},
            {string: 2, fret: 5, label: '♭7', color: '#7b2cbf'},
            {string: 2, fret: 7, label: 'R', color: '#e63946'},
            {string: 3, fret: 5, label: '4', color: '#2ec4b6'},
            {string: 3, fret: 7, label: '5', color: '#ff9f1c'},
            {string: 4, fret: 5, label: '♭7', color: '#7b2cbf'},
            {string: 4, fret: 8, label: 'R', color: '#e63946'},
            {string: 5, fret: 5, label: '4', color: '#2ec4b6'},
            {string: 5, fret: 8, label: '5', color: '#ff9f1c'}
          ]
        },
        {
          id: 'pentatonic-major',
          name: 'C 大调五声音阶',
          enName: 'C Major Pentatonic',
          type: '五声音阶',
          notes: ['C', 'D', 'E', 'G', 'A'],
          intervals: ['1', '2', '3', '5', '6'],
          pattern: [
            {string: 0, fret: 8, label: '5', color: '#ff9f1c'},
            {string: 1, fret: 3, label: '1', color: '#e63946'},
            {string: 1, fret: 5, label: '2', color: '#457b9d'},
            {string: 1, fret: 7, label: '3', color: '#2ec4b6'},
            {string: 2, fret: 5, label: '5', color: '#ff9f1c'},
            {string: 3, fret: 5, label: '6', color: '#7b2cbf'},
            {string: 4, fret: 5, label: '3', color: '#2ec4b6'},
            {string: 4, fret: 8, label: '5', color: '#ff9f1c'},
            {string: 5, fret: 8, label: '6', color: '#7b2cbf'}
          ]
        },
        {
          id: 'natural-minor',
          name: 'A 自然小调音阶',
          enName: 'A Natural Minor',
          type: '自然音阶',
          notes: ['A', 'B', 'C', 'D', 'E', 'F', 'G'],
          intervals: ['1', '2', '♭3', '4', '5', '♭6', '♭7'],
          pattern: []
        },
        {
          id: 'harmonic-minor',
          name: 'A 和声小调音阶',
          enName: 'A Harmonic Minor',
          type: '和声小调',
          notes: ['A', 'B', 'C', 'D', 'E', 'F', 'G#'],
          intervals: ['1', '2', '♭3', '4', '5', '♭6', '7'],
          pattern: []
        },
        {
          id: 'major',
          name: 'C 大调音阶',
          enName: 'C Major Scale',
          type: '大调音阶',
          notes: ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
          intervals: ['1', '2', '3', '4', '5', '6', '7'],
          pattern: []
        },
        {
          id: 'blues',
          name: 'A 蓝调音阶',
          enName: 'A Blues Scale',
          type: '蓝调音阶',
          notes: ['A', 'C', 'D', 'D#', 'E', 'G'],
          intervals: ['1', '♭3', '4', '#4', '5', '♭7'],
          pattern: []
        }
      ];

      function renderScales() {
        grid.innerHTML = '';
        scalesData.forEach(function(scale, index) {
          var card = createScaleCard(scale, index);
          grid.appendChild(card);
        });
      }

      function createScaleCard(scale, index) {
        var card = document.createElement('div');
        card.className = 'scale-card';

        var notesHtml = scale.notes.map(function(note, i) {
          return '<span class="note-badge ' + (i === 0 ? 'root' : '') + '">' + 
                 escapeHtml(note) + ' <small>' + escapeHtml(scale.intervals[i]) + '</small></span>';
        }).join('');

        var fretboardHtml = '';
        if (scale.pattern && scale.pattern.length > 0) {
          fretboardHtml = '<div class="fretboard-container" id="fretboard-' + index + '"></div>';
        }

        card.innerHTML = 
          '<div class="scale-header">' +
            '<div class="scale-title-group">' +
              '<div class="scale-icon">🌠</div>' +
              '<div class="scale-name">' + 
                escapeHtml(scale.name) + 
                '<span>' + escapeHtml(scale.enName) + '</span>' +
              '</div>' +
            '</div>' +
            '<span class="scale-type">' + escapeHtml(scale.type) + '</span>' +
          '</div>' +
          '<div class="scale-body">' +
            '<div class="scale-notes">' + notesHtml + '</div>' +
            fretboardHtml +
            '<div class="audio-controls">' +
              '<button class="play-btn" data-scale="' + index + '">▶</button>' +
              '<span class="play-label">播放音阶</span>' +
            '</div>' +
          '</div>';

        // Render fretboard
        if (scale.pattern && scale.pattern.length > 0) {
          setTimeout(function() {
            var container = document.getElementById('fretboard-' + index);
            if (container && window.renderFretboard) {
              window.renderFretboard(container, {
                numFrets: 5,
                startFret: 3,
                showLabels: true,
                notes: scale.pattern,
                width: container.offsetWidth,
                height: 160
              });
            }
          }, 0);
        }

        // Audio playback
        var playBtn = card.querySelector('.play-btn');
        playBtn.addEventListener('click', function() {
          playScale(scale);
        });

        return card;
      }

      function playScale(scale) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        var baseFreqs = {
          'C': 261.63, 'C#': 277.18, 'D': 293.66, 'D#': 311.13,
          'E': 329.63, 'F': 349.23, 'F#': 369.99, 'G': 392.00,
          'G#': 415.30, 'A': 440.00, 'A#': 466.16, 'B': 493.88
        };

        scale.notes.forEach(function(note, i) {
          setTimeout(function() {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.value = baseFreqs[note] || 440;
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
          }, i * 400);
        });
      }

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      renderScales();
    })();
  </script>
</body>
</html>
