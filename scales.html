  <title>音阶图 | 吉他学习指南</title>
  <meta name="description" content="五声、自然、和声小调等常用音阶，配合音频播放功能，可视化指板图">
  <link rel="stylesheet" href="css/style.css?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    .filter-tabs {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      padding: 0 2rem;
    }
    
    .filter-tab {
      padding: 0.75rem 1.5rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    
    .filter-tab:hover {
      border-color: var(--accent-primary);
      color: var(--text-primary);
    }
    
    .filter-tab.active {
      background: var(--gradient-primary);
      border-color: transparent;
      color: white;
    }
    
    .scales-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 1.5rem;
      padding: 0 2rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    
    .scale-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition-normal);
      backdrop-filter: blur(20px);
    }
    
    .scale-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 107, 53, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    
    .scale-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .scale-title-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .scale-icon {
      width: 48px;
      height: 48px;
      background: var(--gradient-primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    
    .scale-name {
      font-size: 1.2rem;
      font-weight: 700;
    }
    
    .scale-name span {
      display: block;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-muted);
    }
    
    .scale-type {
      padding: 0.3rem 0.8rem;
      background: rgba(255, 107, 53, 0.2);
      border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: var(--radius-xl);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-secondary);
    }
    
    .scale-body {
      padding: 1.5rem;
    }
    
    .scale-notes {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    
    .note-badge {
      padding: 0.5rem 1rem;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      transition: var(--transition-fast);
    }
    
    .note-badge:hover {
      background: rgba(255, 107, 53, 0.2);
      border: 1px solid rgba(255, 107, 53, 0.3);
      color: var(--accent-secondary);
    }
    
    .note-badge.root {
      background: rgba(255, 107, 53, 0.2);
      border: 1px solid rgba(255, 107, 53, 0.3);
      color: var(--accent-secondary);
    }
    
    .fretboard-container {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1rem;
      overflow-x: auto;
    }
    
    .audio-controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    
    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--gradient-primary);
      border: none;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-fast);
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
    }
    
    .play-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.6);
    }
    
    .play-label {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .status-message {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    
    @media (max-width: 768px) {
      .scales-grid {
        grid-template-columns: 1fr;
        padding: 0 1rem;
      }
      
      .filter-tabs {
        padding: 0 1rem;
      }
    }
  </style>

      function renderScales() {
        grid.innerHTML = '';
        
        var filtered = currentFilter === 'all' 
          ? scalesData 
          : scalesData.filter(function(s) {
              return s.type === currentFilter;
            });
        
        if (filtered.length === 0) {
          grid.innerHTML = '<div class="status-message">暂无数据</div>';
          return;
        }
        
        filtered.forEach(function(scale, index) {
          var card = createScaleCard(scale, index);
          grid.appendChild(card);
        });
      }

      function createScaleCard(scale, index) {
        var card = document.createElement('div');
        card.className = 'scale-card';

        var notesHtml = scale.notes.map(function(note, i) {
          return '<span class="note-badge ' + (i === 0 ? 'root' : '') + '">' + 
                 escapeHtml(note) + ' <small>' + escapeHtml(scale.intervals[i]) + '</small></span>';
        }).join('');

        var fretboardHtml = '';
        if (scale.pattern && scale.pattern.length > 0) {
          fretboardHtml = '<div class="fretboard-container" id="fretboard-' + index + '"></div>';
        }

        card.innerHTML = 
          '<div class="scale-header">' +
            '<div class="scale-title-group">' +
              '<div class="scale-icon">🌠</div>' +
              '<div class="scale-name">' + 
                escapeHtml(scale.name) + 
                '<span>' + escapeHtml(scale.enName) + '</span>' +
              '</div>' +
            '</div>' +
            '<span class="scale-type">' + escapeHtml(scale.typeName) + '</span>' +
          '</div>' +
          '<div class="scale-body">' +
            '<div class="scale-notes">' + notesHtml + '</div>' +
            fretboardHtml +
            '<div class="audio-controls">' +
              '<button class="play-btn" data-scale="' + index + '">▶</button>' +
              '<span class="play-label">播放音阶</span>' +
            '</div>' +
          '</div>';

        // Render fretboard
        if (scale.pattern && scale.pattern.length > 0) {
          setTimeout(function() {
            var container = document.getElementById('fretboard-' + index);
            if (container && window.renderFretboard) {
              window.renderFretboard(container, {
                numFrets: 6,
                startFret: 3,
                showLabels: true,
                notes: scale.pattern,
                width: container.offsetWidth,
                height: 160
              });
            }
          }, 0);
        }

        // Audio playback
        var playBtn = card.querySelector('.play-btn');
        playBtn.addEventListener('click', function() {
          playScale(scale);
        });

        return card;
      }

      // Filter tabs
      filterTabs.addEventListener('click', function(e) {
        if (e.target.classList.contains('filter-tab')) {
          document.querySelectorAll('.filter-tab').forEach(function(tab) {
            tab.classList.remove('active');
          });
          e.target.classList.add('active');
          currentFilter = e.target.dataset.filter;
          renderScales();
        }
      });

      function playScale(scale) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        var baseFreqs = {
          'C': 261.63, 'C#': 277.18, 'Db': 277.18, 'D': 293.66, 'D#': 311.13, 'Eb': 311.13,
          'E': 329.63, 'F': 349.23, 'F#': 369.99, 'Gb': 369.99, 'G': 392.00,
          'G#': 415.30, 'Ab': 415.30, 'A': 440.00, 'A#': 466.16, 'Bb': 466.16, 'B': 493.88
        };

        scale.notes.forEach(function(note, i) {
          setTimeout(function() {
            var freq = baseFreqs[note];
            if (!freq) {
              // Try to find enharmonic equivalent
              var enharmonics = {'C': 'B#', 'C#': 'Db', 'D': 'C##', 'D#': 'Eb', 'E': 'Fb', 'F': 'E#', 
                                'F#': 'Gb', 'G': 'F##', 'G#': 'Ab', 'A': 'G##', 'A#': 'Bb', 'B': 'Cb'};
              var enharmonic = Object.keys(enharmonics).find(function(k) { return enharmonics[k] === note; });
              freq = baseFreqs[enharmonic] || 440;
            }
            
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.value = freq;
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
          }, i * 500);
        });
      }

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      renderScales();
    })();
  </script>
</body>
</html>
