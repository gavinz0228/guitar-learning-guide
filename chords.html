<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和弦库 | 吉他学习指南</title>
  <meta name="description" content="完整的吉他和弦库，包含常用24个和弦的按法、音组成和指板图">
  <link rel="stylesheet" href="css/style.css?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .chord-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      padding: 0 2rem;
      max-width: 1600px;
      margin: 0 auto;
      align-items: start; /* 关键：每个卡片保持自己的高度，不延伸填充整个行 */
    }
    
    .chord-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition-normal);
      backdrop-filter: blur(20px);
      cursor: pointer;
      align-self: start; /* 关键：卡片不延伸填充行高度 */
    }
    
    .chord-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 107, 53, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    
    .chord-card.expanded {
      /* Only expand height, not width - stay in grid */
      cursor: default;
    }
    
    .chord-header {
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
    }
    
    .chord-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .chord-name {
      font-size: 1.4rem;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .chord-badge {
      padding: 0.25rem 0.75rem;
      background: rgba(255, 107, 53, 0.2);
      border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: var(--radius-xl);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-secondary);
    }
    
    .chord-body {
      padding: 1.5rem;
    }
    
    .chord-preview {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    
    .chord-fingers {
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    
    .chord-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height var(--transition-slow);
    }
    
    .chord-card.expanded .chord-details {
      max-height: 2000px;
    }
    
    .detail-section {
      padding: 1.5rem;
      border-top: 1px solid var(--glass-border);
    }
    
    .detail-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-secondary);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .notes-container {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    
    .note-badge {
      padding: 0.5rem 1rem;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
    }
    
    .note-badge.root {
      background: rgba(255, 107, 53, 0.2);
      border: 1px solid rgba(255, 107, 53, 0.3);
      color: var(--accent-secondary);
    }
    
    .progressions-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    
    .progression-tag {
      padding: 0.4rem 0.8rem;
      background: var(--bg-secondary);
      border-radius: var(--radius-xl);
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    
    .tips-box {
      background: rgba(255, 107, 53, 0.1);
      border-left: 3px solid var(--accent-primary);
      padding: 1rem;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    
    .fretboard-container {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-top: 1rem;
      overflow-x: auto;
    }
    
    .status-message {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    
    @media (max-width: 768px) {
      .chord-grid {
        grid-template-columns: 1fr;
        padding: 0 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Page Content -->
  <div class="page-content">
    <!-- Page Header -->
    <div class="page-header">
      <span class="section-tag">入门必学</span>
      <h1 class="page-title">和弦<span>库</span></h1>
      <p class="section-desc">
        完整24个常用和弦，涵盖按法、音组成、常用进行和学习技巧
      </p>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">全部</button>
      <button class="filter-tab" data-filter="major">大三和弦</button>
      <button class="filter-tab" data-filter="minor">小三和弦</button>
      <button class="filter-tab" data-filter="dom7">属七和弦</button>
      <button class="filter-tab" data-filter="maj7">大七和弦</button>
    </div>

    <!-- Chord Grid -->
    <div class="chord-grid" id="chordGrid">
      <div class="status-message">加载中...</div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 吉他学习指南. All rights reserved. 🎸</p>
  </footer>

  <script src="js/nav.js?v=5"></script>
  <script src="js/fretboard-renderer.js"></script>
  <script>
    (function() {
      var grid = document.getElementById('chordGrid');
      var filterTabs = document.getElementById('filterTabs');
      var currentFilter = 'all';
      var chordsData = [];
      var expandedCard = null;

      // Load chords data
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'data/chords.json', true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            chordsData = data.chords || [];
            renderChords();
          } catch (e) {
            grid.innerHTML = '<div class="status-message">无法加载和弦数据</div>';
          }
        }
      };
      xhr.send();

      // Filter tabs
      filterTabs.addEventListener('click', function(e) {
        if (e.target.classList.contains('filter-tab')) {
          document.querySelectorAll('.filter-tab').forEach(function(tab) {
            tab.classList.remove('active');
          });
          e.target.classList.add('active');
          currentFilter = e.target.dataset.filter;
          renderChords();
        }
      });

      function renderChords() {
        var filtered = currentFilter === 'all' 
          ? chordsData 
          : chordsData.filter(function(c) {
              if (currentFilter === 'major') return c.category === 'major';
              if (currentFilter === 'minor') return c.category === 'minor';
              if (currentFilter === 'dom7') return c.category === 'dom7';
              if (currentFilter === 'maj7') return c.category === 'maj7';
              return true;
            });

        if (filtered.length === 0) {
          grid.innerHTML = '<div class="status-message">暂无数据</div>';
          return;
        }

        grid.innerHTML = '';
        filtered.forEach(function(chord, index) {
          var card = createChordCard(chord, index);
          grid.appendChild(card);
        });
      }

      function createChordCard(chord, index) {
        var card = document.createElement('div');
        card.className = 'chord-card';
        card.dataset.index = index;

        var difficultyStars = '★'.repeat(chord.difficulty || 1) + '☆'.repeat(5 - (chord.difficulty || 1));
        var categoryName = {
          'major': '大三和弦',
          'minor': '小三和弦', 
          'dom7': '属七和弦',
          'maj7': '大七和弦'
        }[chord.category] || chord.category;

        card.innerHTML = 
          '<div class="chord-header">' +
            '<div class="chord-title">' +
              '<span class="chord-name">' + escapeHtml(chord.name) + '</span>' +
              '<span class="chord-badge">' + escapeHtml(categoryName) + '</span>' +
            '</div>' +
            '<div style="color: var(--accent-tertiary); font-size: 0.9rem;">' + difficultyStars + '</div>' +
          '</div>' +
          '<div class="chord-body">' +
            '<div class="chord-preview">' +
              '<div class="chord-fingers">' +
                '<div>1指: ' + (chord.fingers && chord.fingers[0] ? escapeHtml(chord.fingers[0]) : '-') + '</div>' +
                '<div>2指: ' + (chord.fingers && chord.fingers[1] ? escapeHtml(chord.fingers[1]) : '-') + '</div>' +
                '<div>3指: ' + (chord.fingers && chord.fingers[2] ? escapeHtml(chord.fingers[2]) : '-') + '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="chord-details">' +
            '<div class="detail-section">' +
              '<div class="detail-title">音组成</div>' +
              '<div class="notes-container">' +
                (chord.notes || []).map(function(note, i) {
                  return '<span class="note-badge ' + (i === 0 ? 'root' : '') + '">' + escapeHtml(note) + '</span>';
                }).join('') +
              '</div>' +
            '</div>' +
            '<div class="detail-section">' +
              '<div class="detail-title">常见进行</div>' +
              '<div class="progressions-list">' +
                (chord.commonProgressions || []).map(function(prog) {
                  return '<span class="progression-tag">' + escapeHtml(prog) + '</span>';
                }).join('') +
              '</div>' +
            '</div>' +
            '<div class="detail-section">' +
              '<div class="detail-title">学习提示</div>' +
              '<div class="tips-box">' + escapeHtml(chord.tips || '暂无提示') + '</div>' +
            '</div>' +
            '<div class="detail-section">' +
              '<div class="detail-title">指板位置</div>' +
              '<div class="fretboard-container" id="fretboard-' + index + '"></div>' +
            '</div>' +
          '</div>';

        card.addEventListener('click', function(e) {
          // Toggle current card independently (don't close others)
          card.classList.toggle('expanded');

          if (card.classList.contains('expanded')) {
            setTimeout(function() {
              renderFretboardForChord(chord, 'fretboard-' + index);
            }, 100);
          }
        });

        return card;
      }

      function renderFretboardForChord(chord, containerId) {
        var container = document.getElementById(containerId);
        if (!container || !window.renderFretboard) return;

        var notes = (chord.fretboardNotes || []).map(function(n) {
          return {
            string: n.string,
            fret: n.fret,
            label: n.label,
            color: n.color
          };
        });

        window.renderFretboard(container, {
          numFrets: 5,
          startFret: 0,
          showLabels: true,
          notes: notes,
          width: container.offsetWidth,
          height: 180
        });
      }

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
