<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乐理 | 学吉他</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .theory-section {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px 48px;
    }

    .page-content {
      padding-top: 64px;
      min-height: 100vh;
    }

    .status-message {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* --- Lesson Cards (accordion) --- */
    .lesson-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      overflow: hidden;
      transition: box-shadow var(--transition);
    }

    .lesson-card:hover {
      box-shadow: var(--shadow-hover);
    }

    .lesson-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      cursor: pointer;
      user-select: none;
      transition: background var(--transition);
      gap: 12px;
    }

    .lesson-header:hover {
      background: rgba(255,255,255,0.03);
    }

    [data-theme="light"] .lesson-header:hover {
      background: rgba(0,0,0,0.02);
    }

    .lesson-title-area {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .lesson-title-area .emoji {
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .toggle-icon {
      flex-shrink: 0;
      font-size: 1.2rem;
      color: var(--text-secondary);
      transition: transform 0.3s;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }

    [data-theme="light"] .toggle-icon {
      background: rgba(0,0,0,0.04);
    }

    .lesson-card.open .toggle-icon {
      transform: rotate(180deg);
    }

    .lesson-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .lesson-card.open .lesson-body {
      max-height: 6000px;
    }

    .lesson-body-inner {
      padding: 0 22px 18px;
    }

    /* --- Section items --- */
    .section-item {
      padding: 14px 0;
      border-top: 1px solid var(--card-border);
    }

    .section-item:first-child {
      border-top: none;
      padding-top: 0;
    }

    .section-heading {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-heading::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .section-content {
      font-size: 0.93rem;
      color: var(--text-secondary);
      line-height: 1.8;
      white-space: pre-line;
      padding-left: 12px;
    }

    /* --- Fretboard inside sections --- */
    .section-fretboard {
      margin: 12px 0 6px 12px;
      background: #0d0d0d;
      border-radius: 8px;
      padding: 6px;
      overflow-x: auto;
    }

    .section-fretboard svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .fb-description {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
      margin-left: 12px;
      font-style: italic;
    }

    /* --- Highlight callouts --- */
    .tip-box {
      padding: 10px 14px;
      margin: 8px 0 8px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .tip-box strong {
      color: var(--text-primary);
    }

    /* Nav fix for chord-mastery */
    .nav-links a.active {
      color: var(--accent);
    }

    @media (max-width: 767px) {
      .theory-section { padding: 0 12px 36px; }
      .lesson-header { padding: 14px 16px; }
      .lesson-title-area { font-size: 1rem; }
      .lesson-body-inner { padding: 0 16px 14px; }
      .section-heading { font-size: 0.95rem; }
      .section-content { font-size: 0.88rem; padding-left: 0; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">🎸 学吉他</a>
      <button class="theme-toggle" aria-label="切换主题" onclick="toggleTheme()">🌙</button>
      <button class="hamburger" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="chords.html">和弦库</a>
        <a href="chord-mastery.html">突破前三品</a>
        <a href="scales.html">音阶</a>
        <a href="theory.html" class="active">乐理</a>
        <a href="songs.html">练习曲</a>
        <a href="roadmap.html">学习路线</a>
        <a href="solo.html">Solo教程</a>
      </div>
    </div>
  </nav>

  <div class="page-content">
    <header class="page-header">
      <h1>📖 乐理</h1>
      <p>用指板可视化理解音乐的语言</p>
    </header>

    <div class="theory-section" id="theory-container">
      <div class="status-message">加载中...</div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 吉他学习指南. All rights reserved.</p>
  </footer>

  <script src="js/nav.js?v=2"></script>
  <script src="js/fretboard-renderer.js"></script>
  <script>
    (function () {
      'use strict';

      var container = document.getElementById('theory-container');

      // --- Load theory data ---
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'data/theory.json', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            var lessons = data.lessons || [];
            buildTheory(lessons);
          } catch (e) {
            container.innerHTML = '<div class="status-message">数据加载失败</div>';
          }
        } else if (xhr.readyState === 4) {
          container.innerHTML = '<div class="status-message">加载失败，请稍后重试</div>';
        }
      };
      xhr.send();

      function buildTheory(lessons) {
        container.innerHTML = '';

        if (!lessons || !lessons.length) {
          container.innerHTML = '<div class="status-message">暂无乐理内容</div>';
          return;
        }

        lessons.forEach(function (lesson) {
          var card = document.createElement('div');
          card.className = 'lesson-card';
          card.dataset.lessonId = lesson.id;

          // Header
          var header = document.createElement('div');
          header.className = 'lesson-header';

          var titleArea = document.createElement('div');
          titleArea.className = 'lesson-title-area';
          titleArea.innerHTML = '<span class="emoji">' + (lesson.emoji || '📖') + '</span> ' + escapeHtml(lesson.title);

          var toggle = document.createElement('span');
          toggle.className = 'toggle-icon';
          toggle.textContent = '▼';

          header.appendChild(titleArea);
          header.appendChild(toggle);

          // Body
          var body = document.createElement('div');
          body.className = 'lesson-body';

          var inner = document.createElement('div');
          inner.className = 'lesson-body-inner';

          if (lesson.sections) {
            lesson.sections.forEach(function (section, sIdx) {
              var item = document.createElement('div');
              item.className = 'section-item';

              var heading = document.createElement('div');
              heading.className = 'section-heading';
              heading.textContent = section.heading;
              item.appendChild(heading);

              var content = document.createElement('div');
              content.className = 'section-content';
              content.textContent = section.content;
              item.appendChild(content);

              // Render fretboard
              if (section.fretboard && window.renderFretboard) {
                var fbId = 'fb-theory-' + lesson.id + '-' + sIdx;
                var fbContainer = document.createElement('div');
                fbContainer.className = 'section-fretboard';
                fbContainer.id = fbId;
                item.appendChild(fbContainer);

                if (section.fretboard.description) {
                  var desc = document.createElement('div');
                  desc.className = 'fb-description';
                  desc.textContent = section.fretboard.description;
                  item.appendChild(desc);
                }

                // Defer render
                setTimeout((function (id, data) {
                  return function () {
                    renderFretboardForSection(id, data);
                  };
                })(fbId, section.fretboard), 50);
              }

              inner.appendChild(item);
            });
          }

          body.appendChild(inner);
          card.appendChild(header);
          card.appendChild(body);
          container.appendChild(card);

          // Accordion toggle
          header.addEventListener('click', function () {
            var isOpen = card.classList.contains('open');
            document.querySelectorAll('.lesson-card.open').forEach(function (c) {
              c.classList.remove('open');
            });
            if (!isOpen) {
              card.classList.add('open');
            }
          });
        });
      }

      function renderFretboardForSection(containerId, fbData) {
        var el = document.getElementById(containerId);
        if (!el || !fbData) return;

        if (fbData.type === 'full' && fbData.notes) {
          window.renderFretboard(el, {
            numFrets: fbData.numFrets || 12,
            startFret: fbData.startFret || 0,
            showLabels: true,
            notes: fbData.notes || [],
            width: 680,
            height: 220
          });
        } else if (fbData.type === 'full' && !fbData.notes) {
          // Full fretboard with no custom notes — just grid
          window.renderFretboard(el, {
            numFrets: fbData.numFrets || 12,
            startFret: fbData.startFret || 0,
            showLabels: true,
            width: 680,
            height: 220
          });
        } else if (fbData.type === 'caged') {
          window.renderFretboard(el, {
            numFrets: fbData.numFrets || 5,
            startFret: fbData.startFret || 0,
            cagedShape: fbData.cagedShape || 'C',
            rootNote: fbData.rootNote || 'C',
            showLabels: true,
            width: 600,
            height: 200
          });
        }
      }

      function escapeHtml(str) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
      }

    })();
  </script>

</body>
</html>
