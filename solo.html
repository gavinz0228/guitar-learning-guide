<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo教程 | 学吉他</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .solo-section {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px 48px;
    }

    .page-content {
      padding-top: 64px;
      min-height: 100vh;
    }

    .status-message {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* --- Phase Indicator --- */
    .phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    /* --- Phase Cards --- */
    .phase-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 32px;
      overflow: hidden;
      transition: box-shadow var(--transition);
    }

    .phase-card:hover {
      box-shadow: var(--shadow-hover);
    }

    .phase-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 26px;
      border-bottom: 1px solid var(--card-border);
      cursor: pointer;
      user-select: none;
    }

    .phase-header:hover {
      background: rgba(255,255,255,0.02);
    }

    .phase-icon {
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .phase-title {
      flex: 1;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .phase-toggle {
      font-size: 1.2rem;
      color: var(--text-secondary);
      transition: transform 0.3s;
      width: 28px;
      text-align: center;
    }

    .phase-card.open .phase-toggle {
      transform: rotate(180deg);
    }

    .phase-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .phase-card.open .phase-body {
      max-height: 8000px;
    }

    .phase-body-inner {
      padding: 20px 26px;
    }

    /* --- Section items --- */
    .section-item {
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    [data-theme="light"] .section-item {
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .section-item:last-child {
      border-bottom: none;
    }

    .section-heading {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-heading::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      border-radius: 2px;
      background: var(--accent);
      flex-shrink: 0;
    }

    .section-content {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.8;
      white-space: pre-line;
    }

    /* --- Fretboard container inside sections --- */
    .section-fretboard {
      margin: 14px 0 8px;
      background: #0d0d0d;
      border-radius: 8px;
      padding: 8px;
      overflow-x: auto;
    }

    .section-fretboard svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .fb-description {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
      text-align: center;
      font-style: italic;
    }

    /* --- Practice callout --- */
    .practice-callout {
      background: rgba(230,57,70,0.06);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 12px 16px;
      margin: 10px 0;
      font-size: 0.9rem;
      color: var(--text-primary);
      line-height: 1.7;
    }

    .practice-callout strong {
      color: var(--accent);
    }

    /* --- Highlight boxes --- */
    .tip-box {
      padding: 10px 14px;
      margin: 8px 0;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .tip-box strong {
      color: var(--text-primary);
    }

    @media (max-width: 767px) {
      .solo-section { padding: 0 12px 40px; }
      .phase-header { padding: 14px 16px; }
      .phase-body-inner { padding: 14px 16px; }
      .section-heading { font-size: 0.95rem; }
      .section-content { font-size: 0.9rem; }
      .phase-title { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">🎸 学吉他</a>
      <button class="theme-toggle" aria-label="切换主题" onclick="toggleTheme()">🌙</button>
      <button class="hamburger" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="chords.html">和弦库</a>
        <a href="chord-mastery.html">突破前三品</a>
        <a href="scales.html">音阶</a>
        <a href="theory.html">乐理</a>
        <a href="songs.html">练习曲</a>
        <a href="roadmap.html">学习路线</a>
        <a href="solo.html">Solo教程</a>
      </div>
    </div>
  </nav>

  <div class="page-content">
    <header class="page-header">
      <h1>🎸 Solo教程</h1>
      <p>从零开始，分阶段学会弹Solo</p>
    </header>

    <div class="solo-section" id="solo-lessons">
      <div class="status-message">加载中...</div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 吉他学习指南. All rights reserved.</p>
  </footer>

  <script src="js/nav.js?v=2"></script>
  <script src="js/fretboard-renderer.js"></script>
  <script>
    (function () {
      'use strict';

      var container = document.getElementById('solo-lessons');

      // Phase badge colors
      var PHASE_COLORS = [
        '#2d6a4f',
        '#457b9d',
        '#c8960a',
        '#e63946',
        '#7b2d8b'
      ];

      // --- Load data ---
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'data/solo.json', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data.soloLessons && data.soloLessons.length) {
              renderPhases(data.soloLessons);
            } else {
              container.innerHTML = '<div class="status-message">暂无Solo教程内容</div>';
            }
          } catch (e) {
            container.innerHTML = '<div class="status-message">数据加载失败</div>';
          }
        }
      };
      xhr.send();

      // --- Render all phases ---
      function renderPhases(phases) {
        container.innerHTML = '';

        phases.forEach(function (phase, pIdx) {
          var card = document.createElement('div');
          card.className = 'phase-card';

          var badgeBg = PHASE_COLORS[pIdx % PHASE_COLORS.length];

          // Header (clickable accordion)
          var header = document.createElement('div');
          header.className = 'phase-header';
          header.innerHTML =
            '<span class="phase-icon">' + (phase.emoji || '📖') + '</span>' +
            '<div>' +
              '<div class="phase-badge" style="background:' + badgeBg + ';">' + escapeHtml(phase.phase || '') + '</div>' +
              '<div class="phase-title">' + escapeHtml(phase.id ? phase.id.replace('phase', '第') + '阶段' : '') + '</div>' +
            '</div>' +
            '<span class="phase-toggle">▼</span>';
          card.appendChild(header);

          // Body
          var body = document.createElement('div');
          body.className = 'phase-body';

          var inner = document.createElement('div');
          inner.className = 'phase-body-inner';

          if (phase.sections) {
            phase.sections.forEach(function (section, sIdx) {
              var item = document.createElement('div');
              item.className = 'section-item';

              var heading = document.createElement('div');
              heading.className = 'section-heading';
              heading.textContent = section.heading;
              item.appendChild(heading);

              var content = document.createElement('div');
              content.className = 'section-content';
              content.textContent = section.content;
              item.appendChild(content);

              // Render fretboard if specified
              if (section.fretboard && window.renderFretboard) {
                var fbContainer = document.createElement('div');
                fbContainer.className = 'section-fretboard';
                fbContainer.id = 'fb-solo-' + pIdx + '-' + sIdx;

                // Wait for DOM, then render
                setTimeout((function (fbId, fbData) {
                  return function () {
                    renderFretboardForSection(fbId, fbData);
                  };
                })(fbContainer.id, section.fretboard), 50);

                item.appendChild(fbContainer);

                if (section.fretboard.description) {
                  var desc = document.createElement('div');
                  desc.className = 'fb-description';
                  desc.textContent = section.fretboard.description;
                  item.appendChild(desc);
                }
              }

              inner.appendChild(item);
            });
          }

          body.appendChild(inner);
          card.appendChild(body);
          container.appendChild(card);

          // Click to toggle
          header.addEventListener('click', function () {
            card.classList.toggle('open');
          });
        });

        // Open first phase by default
        var firstCard = container.querySelector('.phase-card');
        if (firstCard) {
          firstCard.classList.add('open');
        }
      }

      // --- Render fretboard based on data type ---
      function renderFretboardForSection(containerId, fbData) {
        var el = document.getElementById(containerId);
        if (!el || !fbData) return;

        if (fbData.type === 'caged' && window.renderFretboard) {
          window.renderFretboard(el, {
            numFrets: fbData.numFrets || 5,
            startFret: fbData.startFret || 0,
            cagedShape: fbData.cagedShape || 'E',
            rootNote: fbData.rootNote || 'E',
            showLabels: fbData.showLabels !== false,
            width: 600,
            height: 200,
            highlightRoots: true
          });
        } else if (fbData.type === 'full' && fbData.notes && window.renderFretboard) {
          window.renderFretboard(el, {
            numFrets: fbData.numFrets || 12,
            startFret: fbData.startFret || 0,
            showLabels: true,
            notes: fbData.notes,
            width: 680,
            height: 220
          });
        }
      }

      function escapeHtml(str) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
      }

    })();
  </script>

</body>
</html>
