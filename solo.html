<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo教程 | 学吉他</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .solo-section {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px 48px;
    }

    .page-content {
      padding-top: 64px;
      min-height: 100vh;
    }

    .status-message {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* --- Phase Indicator --- */
    .phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    /* --- Phase Cards --- */
    .phase-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 32px;
      overflow: hidden;
      transition: box-shadow var(--transition);
    }

    .phase-card:hover {
      box-shadow: var(--shadow-hover);
    }

    .phase-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 26px;
      border-bottom: 1px solid var(--card-border);
      cursor: pointer;
      user-select: none;
    }

    .phase-header:hover {
      background: rgba(255,255,255,0.02);
    }

    .phase-icon {
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .phase-title {
      flex: 1;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .phase-toggle {
      font-size: 1.2rem;
      color: var(--text-secondary);
      transition: transform 0.3s;
      width: 28px;
      text-align: center;
    }

    .phase-card.open .phase-toggle {
      transform: rotate(180deg);
    }

    .phase-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .phase-card.open .phase-body {
      max-height: 8000px;
    }

    .phase-body-inner {
      padding: 20px 26px;
    }

    /* --- Section items --- */
    .section-item {
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    [data-theme="light"] .section-item {
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .section-item:last-child {
      border-bottom: none;
    }

    .section-heading {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-heading::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      border-radius: 2px;
      background: var(--accent);
      flex-shrink: 0;
    }

    .section-content {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.8;
      white-space: pre-line;
    }

    /* --- Fretboard container inside sections --- */
    .section-fretboard {
      margin: 14px 0 8px;
      background: #0d0d0d;
      border-radius: 8px;
      padding: 8px;
      overflow-x: auto;
    }

    .section-fretboard svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .fb-description {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
      text-align: center;
      font-style: italic;
    }

    /* --- Practice callout --- */
    .practice-callout {
      background: rgba(230,57,70,0.06);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 12px 16px;
      margin: 10px 0;
      font-size: 0.9rem;
      color: var(--text-primary);
      line-height: 1.7;
    }

    .practice-callout strong {
      color: var(--accent);
    }

    /* --- Highlight boxes --- */
    .tip-box {
      padding: 10px 14px;
      margin: 8px 0;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .tip-box strong {
      color: var(--text-primary);
    }

    /* --- Practice Mode --- */
    .practice-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 32px;
      overflow: hidden;
      transition: box-shadow var(--transition);
    }

    .practice-section:hover {
      box-shadow: var(--shadow-hover);
    }

    .practice-header {
      padding: 20px 26px;
      border-bottom: 1px solid var(--card-border);
    }

    .practice-header h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
    }

    .practice-body {
      padding: 20px 26px;
    }

    .practice-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      margin-bottom: 20px;
    }

    .bpm-group {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 16px;
    }

    .bpm-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 600;
      white-space: nowrap;
    }

    .bpm-display {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      min-width: 60px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .bpm-slider {
      width: 120px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .practice-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .practice-btn:active {
      transform: scale(0.96);
    }

    .btn-metronome {
      background: #2d6a4f;
      color: #fff;
    }

    .btn-metronome.active {
      background: #e63946;
      box-shadow: 0 0 12px rgba(230,57,70,0.4);
    }

    .btn-metronome:hover {
      opacity: 0.9;
    }

    .btn-backing {
      background: #457b9d;
      color: #fff;
    }

    .btn-backing.active {
      background: #7b2cbf;
      box-shadow: 0 0 12px rgba(123,44,191,0.4);
    }

    .btn-backing:hover {
      opacity: 0.9;
    }

    .beat-indicator {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }

    .beat-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      transition: background 0.08s;
    }

    .beat-dot.active-strong {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(230,57,70,0.5);
    }

    .beat-dot.active-weak {
      background: #2ec4b6;
      box-shadow: 0 0 6px rgba(46,196,182,0.4);
    }

    /* --- Practice Fretboard --- */
    .practice-fretboard-section {
      margin-top: 16px;
    }

    .practice-fretboard-section h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin: 0 0 10px 0;
    }

    .practice-fretboard {
      margin: 0;
      background: #0d0d0d;
      border-radius: 8px;
      padding: 8px;
      overflow-x: auto;
    }

    .practice-fretboard svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .practice-fretboard-desc {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
      text-align: center;
      font-style: italic;
    }

    @media (max-width: 767px) {
      .solo-section { padding: 0 12px 40px; }
      .phase-header { padding: 14px 16px; }
      .phase-body-inner { padding: 14px 16px; }
      .section-heading { font-size: 0.95rem; }
      .section-content { font-size: 0.9rem; }
      .phase-title { font-size: 1.05rem; }
      .practice-controls { flex-direction: column; align-items: stretch; }
      .bpm-group { flex-wrap: wrap; }
      .bpm-slider { width: 100%; }
    }
  </style>
</head>

  <div class="page-content">
    <header class="page-header">
      <h1>🎸 Solo教程</h1>
      <p>从零开始，分阶段学会弹Solo</p>
    </header>

    <div class="solo-section" id="solo-lessons">
      <div class="status-message">加载中...</div>
    </div>
  </div>

  <!-- ============ 🎯 练习模式 ============ -->
  <div class="solo-section">
    <div class="practice-section">
      <div class="practice-header">
        <h2>🎯 练习模式</h2>
      </div>
      <div class="practice-body">
        <!-- Controls -->
        <div class="practice-controls">
          <div class="bpm-group">
            <span class="bpm-label">BPM</span>
            <input type="range" class="bpm-slider" id="practice-bpm-slider"
                   min="40" max="160" step="1" value="70"
                   aria-label="BPM调节">
            <span class="bpm-display" id="practice-bpm-display">70</span>
          </div>
          <div class="btn-group">
            <button class="practice-btn btn-metronome" id="practice-btn-metronome">🎵 节拍器</button>
            <button class="practice-btn btn-backing" id="practice-btn-backing">🎸 背景音</button>

        <!-- Beat indicator dots -->
        <div class="beat-indicator" id="practice-beat-indicator">
          <div class="beat-dot" data-beat="1"></div>
          <div class="beat-dot" data-beat="2"></div>
          <div class="beat-dot" data-beat="3"></div>
          <div class="beat-dot" data-beat="4"></div>
        </div>

        <!-- Practice Fretboard -->
        <div class="practice-fretboard-section">
          <h3>🎸 E小调五声音阶 — Pattern 1 指板图</h3>
          <div class="practice-fretboard" id="practice-fretboard"></div>
          <div class="practice-fretboard-desc">E小调五声音阶第一把位（根音 E），圆点为可演奏的音符</div>
        </div>

  <script src="js/nav.js?v=2"></script>
  <script src="js/fretboard-renderer.js"></script>
  <script>
    (function () {
      'use strict';

      var container = document.getElementById('solo-lessons');

      // Phase badge colors
      var PHASE_COLORS = [
        '#2d6a4f',
        '#457b9d',
        '#c8960a',
        '#e63946',
        '#7b2d8b'
      ];

      // --- Load data ---
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'data/solo.json', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data.soloLessons && data.soloLessons.length) {
              renderPhases(data.soloLessons);
            } else {
              container.innerHTML = '<div class="status-message">暂无Solo教程内容</div>';
            }
          } catch (e) {
            container.innerHTML = '<div class="status-message">数据加载失败</div>';
          }
        }
      };
      xhr.send();

      // --- Render all phases ---
      function renderPhases(phases) {
        container.innerHTML = '';

        phases.forEach(function (phase, pIdx) {
          var card = document.createElement('div');
          card.className = 'phase-card';

          var badgeBg = PHASE_COLORS[pIdx % PHASE_COLORS.length];

          // Header (clickable accordion)
          var header = document.createElement('div');
          header.className = 'phase-header';
          header.innerHTML =
            '<span class="phase-icon">' + (phase.emoji || '📖') + '</span>' +
            '<div>' +
              '<div class="phase-badge" style="background:' + badgeBg + ';">' + escapeHtml(phase.phase || '') + '</div>' +
              '<div class="phase-title">' + escapeHtml(phase.id ? phase.id.replace('phase', '第') + '阶段' : '') + '</div>' +
            '</div>' +
            '<span class="phase-toggle">▼</span>';
          card.appendChild(header);

          // Body
          var body = document.createElement('div');
          body.className = 'phase-body';

          var inner = document.createElement('div');
          inner.className = 'phase-body-inner';

          if (phase.sections) {
            phase.sections.forEach(function (section, sIdx) {
              var item = document.createElement('div');
              item.className = 'section-item';

              var heading = document.createElement('div');
              heading.className = 'section-heading';
              heading.textContent = section.heading;
              item.appendChild(heading);

              var content = document.createElement('div');
              content.className = 'section-content';
              content.textContent = section.content;
              item.appendChild(content);

              // Render fretboard if specified
              if (section.fretboard && window.renderFretboard) {
                var fbContainer = document.createElement('div');
                fbContainer.className = 'section-fretboard';
                fbContainer.id = 'fb-solo-' + pIdx + '-' + sIdx;

                // Wait for DOM, then render
                setTimeout((function (fbId, fbData) {
                  return function () {
                    renderFretboardForSection(fbId, fbData);
                  };
                })(fbContainer.id, section.fretboard), 50);

                item.appendChild(fbContainer);

                if (section.fretboard.description) {
                  var desc = document.createElement('div');
                  desc.className = 'fb-description';
                  desc.textContent = section.fretboard.description;
                  item.appendChild(desc);
                }
              }

              inner.appendChild(item);
            });
          }

          body.appendChild(inner);
          card.appendChild(body);
          container.appendChild(card);

          // Click to toggle
          header.addEventListener('click', function () {
            card.classList.toggle('open');
          });
        });

        // Open first phase by default
        var firstCard = container.querySelector('.phase-card');
        if (firstCard) {
          firstCard.classList.add('open');
        }
      }

      // --- Render fretboard based on data type ---
      function renderFretboardForSection(containerId, fbData) {
        var el = document.getElementById(containerId);
        if (!el || !fbData) return;

        if (fbData.type === 'caged' && window.renderFretboard) {
          window.renderFretboard(el, {
            numFrets: fbData.numFrets || 5,
            startFret: fbData.startFret || 0,
            cagedShape: fbData.cagedShape || 'E',
            rootNote: fbData.rootNote || 'E',
            showLabels: fbData.showLabels !== false,
            width: 600,
            height: 200,
            highlightRoots: true
          });
        } else if (fbData.type === 'full' && fbData.notes && window.renderFretboard) {
          window.renderFretboard(el, {
            numFrets: fbData.numFrets || 12,
            startFret: fbData.startFret || 0,
            showLabels: true,
            notes: fbData.notes,
            width: 680,
            height: 220
          });
        }
      }

      function escapeHtml(str) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
      }

    })();

    // ============ 🎯 Practice Mode ============
    (function () {
      'use strict';

      // --- DOM refs ---
      var bpmSlider = document.getElementById('practice-bpm-slider');
      var bpmDisplay = document.getElementById('practice-bpm-display');
      var btnMetronome = document.getElementById('practice-btn-metronome');
      var btnBacking = document.getElementById('practice-btn-backing');
      var beatDots = document.querySelectorAll('#practice-beat-indicator .beat-dot');

      // --- State ---
      var bpm = 70;
      var metronomeRunning = false;
      var backingRunning = false;
      var metronomeTimer = null;
      var currentBeat = 0; // 0-3

      // --- Audio ---
      var audioCtx = null;

      function getAudioCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
      }

      // --- Metronome click ---
      function playClick(beat) {
        try {
          var ctx = getAudioCtx();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          var freq = (beat === 0) ? 800 : 500; // 强拍800Hz, 弱拍500Hz
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          osc.type = 'sine';

          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);

          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.08);
        } catch (e) {
          // Silently fail
        }
      }

      // --- Beat indicator ---
      function updateBeatIndicator(beat) {
        beatDots.forEach(function (dot, i) {
          dot.className = 'beat-dot';
          if (i === beat) {
            dot.classList.add((i === 0) ? 'active-strong' : 'active-weak');
          }
        });
      }

      function clearBeatIndicator() {
        beatDots.forEach(function (dot) {
          dot.className = 'beat-dot';
        });
      }

      // --- Metronome loop ---
      function startMetronome() {
        if (metronomeTimer) return;
        bpm = parseInt(bpmSlider.value, 10) || 70;
        currentBeat = 0;
        var intervalMs = Math.round(60000 / bpm);

        // Play first beat immediately
        playClick(0);
        updateBeatIndicator(0);

        metronomeTimer = setInterval(function () {
          currentBeat = (currentBeat + 1) % 4;
          playClick(currentBeat);
          updateBeatIndicator(currentBeat);
        }, intervalMs);

        metronomeRunning = true;
        btnMetronome.textContent = '⏹ 停止节拍器';
        btnMetronome.classList.add('active');
      }

      function stopMetronome() {
        if (metronomeTimer) {
          clearInterval(metronomeTimer);
          metronomeTimer = null;
        }
        metronomeRunning = false;
        clearBeatIndicator();
        btnMetronome.textContent = '🎵 节拍器';
        btnMetronome.classList.remove('active');
      }

      function toggleMetronome() {
        if (metronomeRunning) {
          stopMetronome();
        } else {
          startMetronome();
        }
      }

      // --- BPM slider ---
      bpmSlider.addEventListener('input', function () {
        bpm = parseInt(this.value, 10) || 70;
        bpmDisplay.textContent = bpm;
        if (metronomeRunning) {
          // Restart metronome with new BPM
          stopMetronome();
          startMetronome();
        }
      });

      // --- Metronome button ---
      btnMetronome.addEventListener('click', toggleMetronome);

      // --- Backing track (简单背景音) ---
      var backingOscillators = [];
      var backingGain = null;

      function startBacking() {
        try {
          var ctx = getAudioCtx();

          // Create a gentle drone/chord backing using multiple oscillators
          var baseFreq = 82.41; // Low E (E2)
          var chordFreqs = [
            baseFreq,          // E (root)
            baseFreq * 6/5,    // G (♭3) — minor third
            baseFreq * 3/2,    // B (5th)
            baseFreq * 2       // E (octave)
          ];

          backingGain = ctx.createGain();
          backingGain.gain.setValueAtTime(0.08, ctx.currentTime);
          backingGain.connect(ctx.destination);

          chordFreqs.forEach(function (freq) {
            var osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            var oscGain = ctx.createGain();
            // Slight volume variation for warmth
            oscGain.gain.setValueAtTime(0.6 + Math.random() * 0.2, ctx.currentTime);
            osc.connect(oscGain);
            oscGain.connect(backingGain);
            osc.start();
            backingOscillators.push(osc);
          });

          backingRunning = true;
          btnBacking.textContent = '⏹ 停止背景音';
          btnBacking.classList.add('active');
        } catch (e) {
          console.warn('Backing track error:', e);
        }
      }

      function stopBacking() {
        backingOscillators.forEach(function (osc) {
          try { osc.stop(); } catch (e) {}
        });
        backingOscillators = [];
        backingRunning = false;
        btnBacking.textContent = '🎸 背景音';
        btnBacking.classList.remove('active');
      }

      function toggleBacking() {
        if (backingRunning) {
          stopBacking();
        } else {
          startBacking();
        }
      }

      btnBacking.addEventListener('click', toggleBacking);

      // --- Render practice fretboard (E minor pentatonic pattern 1) ---
      function renderPracticeFretboard() {
        var el = document.getElementById('practice-fretboard');
        if (!el || !window.renderFretboard) return;

        // E minor pentatonic notes: E, G, A, B, D
        // Pattern 1 (open position, starting from fret 0)
        var eminPentNotes = [
          { string: 0, fret: 0,  label: 'R', color: '#e63946', stroke: '#ff6b7a' },
          { string: 0, fret: 3,  label: '♭3', color: '#3a3a3a', stroke: '#666' },
          { string: 1, fret: 0,  label: '4', color: '#3a3a3a', stroke: '#666' },
          { string: 1, fret: 2,  label: '5', color: '#3a3a3a', stroke: '#666' },
          { string: 2, fret: 0,  label: '♭7', color: '#3a3a3a', stroke: '#666' },
          { string: 2, fret: 2,  label: 'R', color: '#e63946', stroke: '#ff6b7a' },
          { string: 3, fret: 0,  label: '♭3', color: '#3a3a3a', stroke: '#666' },
          { string: 3, fret: 2,  label: '4', color: '#3a3a3a', stroke: '#666' },
          { string: 4, fret: 1,  label: '5', color: '#3a3a3a', stroke: '#666' },
          { string: 4, fret: 3,  label: '♭7', color: '#3a3a3a', stroke: '#666' },
          { string: 5, fret: 0,  label: 'R', color: '#e63946', stroke: '#ff6b7a' },
          { string: 5, fret: 3,  label: '♭3', color: '#3a3a3a', stroke: '#666' }
        ];

        window.renderFretboard(el, {
          numFrets: 4,
          startFret: 0,
          showLabels: true,
          notes: eminPentNotes,
          width: 600,
          height: 200
        });
      }

      // --- Init ---
      // Render practice fretboard after DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderPracticeFretboard);
      } else {
        renderPracticeFretboard();
      }

    })();
  </script>

</body>
</html>
