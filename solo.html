<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo教程 | 吉他学习指南</title>
  <meta name="description" content="五声音阶入门到进阶技巧，配备节拍器和练习乐句示例">
  <link rel="stylesheet" href="css/style.css?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .phases-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }
    
    .phase-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      margin-bottom: 1.5rem;
      overflow: hidden;
      transition: var(--transition-normal);
      backdrop-filter: blur(20px);
    }
    
    .phase-card:hover {
      border-color: rgba(255, 107, 53, 0.3);
    }
    
    .phase-header {
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: var(--transition-fast);
    }
    
    .phase-card.open .phase-header {
      border-bottom-color: var(--glass-border);
    }
    
    .phase-title-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .phase-number {
      width: 48px;
      height: 48px;
      background: var(--gradient-primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      color: white;
      flex-shrink: 0;
    }
    
    .phase-title {
      font-size: 1.2rem;
      font-weight: 700;
    }
    
    .phase-badge {
      padding: 0.3rem 0.8rem;
      background: rgba(255, 107, 53, 0.2);
      border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: var(--radius-xl);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-secondary);
    }
    
    .phase-toggle {
      font-size: 1.5rem;
      color: var(--text-muted);
      transition: transform var(--transition-fast);
    }
    
    .phase-card.open .phase-toggle {
      transform: rotate(180deg);
    }
    
    .phase-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height var(--transition-slow);
    }
    
    .phase-card.open .phase-body {
      max-height: 8000px;
    }
    
    .phase-content {
      padding: 1.5rem;
    }
    
    .section-item {
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--glass-border);
    }
    
    .section-item:last-child {
      border-bottom: none;
    }
    
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-secondary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .section-content {
      color: var(--text-secondary);
      line-height: 1.8;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    
    .fretboard-wrapper {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin: 1rem 0;
      overflow-x: auto;
    }
    
    .fretboard-desc {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 0.75rem;
    }
    
    /* Practice Section */
    .practice-section {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin: 2rem auto;
      max-width: 1000px;
      backdrop-filter: blur(20px);
    }
    
    .practice-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .practice-header h2 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    
    .practice-header p {
      color: var(--text-muted);
    }
    
    .practice-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .bpm-control {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg-secondary);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-xl);
    }
    
    .bpm-control label {
      font-weight: 600;
      color: var(--text-secondary);
    }
    
    .bpm-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-secondary);
      min-width: 50px;
      text-align: center;
    }
    
    .practice-btn {
      padding: 0.875rem 1.5rem;
      border-radius: var(--radius-xl);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
      border: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .practice-btn.metronome {
      background: var(--gradient-primary);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
    }
    
    .practice-btn.metronome:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 107, 53, 0.6);
    }
    
    .practice-btn.backing {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
    }
    
    .practice-btn.backing:hover {
      border-color: var(--accent-primary);
    }
    
    .beat-indicator {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 1.5rem 0;
    }
    
    .beat-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      transition: all var(--transition-fast);
    }
    
    .beat-dot.active {
      background: var(--gradient-primary);
      box-shadow: 0 0 20px rgba(255, 107, 53, 0.8);
      transform: scale(1.3);
    }
    
    .beat-dot:first-child.active {
      background: linear-gradient(135deg, #ff6b35 0%, #ff4444 100%);
    }
    
    .lick-section {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--glass-border);
    }
    
    .lick-section h3 {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    
    .lick-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    
    .lick-btn {
      padding: 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    
    .lick-btn:hover {
      border-color: var(--accent-primary);
      background: rgba(255, 107, 53, 0.1);
    }
    
    .lick-display {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre-wrap;
      min-height: 80px;
    }
    
    @media (max-width: 768px) {
      .phases-container {
        padding: 0 1rem;
      }
      
      .practice-section {
        padding: 1.5rem;
        margin: 1.5rem 1rem;
      }
      
      .practice-controls {
        flex-direction: column;
      }
      
      .phase-title {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Page Content -->
  <div class="page-content">
    <!-- Page Header -->
    <div class="page-header">
      <span class="section-tag">高阶技巧</span>
      <h1 class="page-title">Solo<span>教程</span></h1>
      <p class="section-desc">
        五声音阶入门到进阶技巧，配备节拍器和练习乐句示例
      </p>
    </div>

    <!-- Phases Container -->
    <div class="phases-container" id="phasesContainer">
      <div class="status-message">加载中...</div>
    </div>

    <!-- Practice Section -->
    <div class="practice-section">
      <div class="practice-header">
        <h2>🎯 练习模式</h2>
        <p>搭配节拍器练习，掌握稳定节奏感</p>
      </div>
      
      <div class="practice-controls">
        <div class="bpm-control">
          <label>BPM</label>
          <input type="range" id="bpmSlider" min="40" max="160" value="70" style="width: 150px;">
          <span class="bpm-value" id="bpmDisplay">70</span>
        </div>
        <button class="practice-btn metronome" id="btnMetronome">
          <span>🎵</span> 节拍器
        </button>
        <button class="practice-btn backing" id="btnBacking">
          <span>🎸</span> 背景音
        </button>
      </div>
      
      <div class="beat-indicator">
        <div class="beat-dot" data-beat="1"></div>
        <div class="beat-dot" data-beat="2"></div>
        <div class="beat-dot" data-beat="3"></div>
        <div class="beat-dot" data-beat="4"></div>
      </div>
      
      <div class="fretboard-wrapper">
        <div id="practiceFretboard"></div>
        <div class="fretboard-desc">E小调五声音阶 Pattern 1 指板图</div>
      </div>
      
      <div class="lick-section">
        <h3>🎵 五声音阶乐句示例</h3>
        <div class="lick-buttons">
          <button class="lick-btn" data-lick="1">乐句 1 上行</button>
          <button class="lick-btn" data-lick="2">乐句 2 下行</button>
          <button class="lick-btn" data-lick="3">乐句 3 跳跃</button>
          <button class="lick-btn" data-lick="4">乐句 4 锤勾</button>
        </div>
        <div class="lick-display" id="lickDisplay">点击上方按钮播放乐句</div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 吉他学习指南. All rights reserved. 🎸</p>
  </footer>

  <script src="js/nav.js?v=6"></script>
  <script src="js/fretboard-renderer.js"></script>
  <script>
    (function() {
      // Load phases data
      var container = document.getElementById('phasesContainer');
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'data/solo.json', true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            renderPhases(data.soloLessons || []);
          } catch (e) {
            container.innerHTML = '<div class="status-message">无法加载教程数据</div>';
          }
        }
      };
      xhr.send();

      function renderPhases(phases) {
        if (!phases.length) {
          container.innerHTML = '<div class="status-message">暂无数据</div>';
          return;
        }

        container.innerHTML = '';
        phases.forEach(function(phase, index) {
          var card = createPhaseCard(phase, index);
          container.appendChild(card);
        });
      }

      function createPhaseCard(phase, index) {
        var card = document.createElement('div');
        card.className = 'phase-card';
        if (index === 0) card.classList.add('open');

        var sectionsHtml = (phase.sections || []).map(function(section) {
          var fretboardHtml = '';
          if (section.fretboard) {
            fretboardHtml = '<div class="fretboard-wrapper"><div id="fretboard-' + index + '-' + section.heading.replace(/\s+/g, '') + '"></div></div>';
          }
          
          return '<div class="section-item">' +
            '<div class="section-title">' + escapeHtml(section.heading) + '</div>' +
            '<div class="section-content">' + escapeHtml(section.content).replace(/\n/g, '<br>') + '</div>' +
            fretboardHtml +
          '</div>';
        }).join('');

        card.innerHTML = 
          '<div class="phase-header">' +
            '<div class="phase-title-group">' +
              '<div class="phase-number">' + (index + 1) + '</div>' +
              '<div>' +
                '<div class="phase-title">' + escapeHtml(phase.phase) + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="phase-toggle">▼</div>' +
          '</div>' +
          '<div class="phase-body">' +
            '<div class="phase-content">' + sectionsHtml + '</div>' +
          '</div>';

        card.querySelector('.phase-header').addEventListener('click', function() {
          card.classList.toggle('open');
          
          // Render fretboards if expanding
          if (card.classList.contains('open') && phase.sections) {
            phase.sections.forEach(function(section) {
              if (section.fretboard) {
                var id = 'fretboard-' + index + '-' + section.heading.replace(/\s+/g, '');
                renderSectionFretboard(section.fretboard, id);
              }
            });
          }
        });

        return card;
      }

      function renderSectionFretboard(config, containerId) {
        var container = document.getElementById(containerId);
        if (!container || !window.renderFretboard) return;
        
        window.renderFretboard(container, {
          numFrets: config.numFrets || 5,
          startFret: config.startFret || 0,
          showLabels: true,
          notes: config.notes || [],
          width: container.offsetWidth,
          height: 180
        });
      }

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Metronome and Practice Mode
      var bpmSlider = document.getElementById('bpmSlider');
      var bpmDisplay = document.getElementById('bpmDisplay');
      var btnMetronome = document.getElementById('btnMetronome');
      var btnBacking = document.getElementById('btnBacking');
      var beatDots = document.querySelectorAll('.beat-dot');
      var lickDisplay = document.getElementById('lickDisplay');
      
      var metronomeRunning = false;
      var metronomeTimer = null;
      var currentBeat = 0;
      var audioCtx = null;

      bpmSlider.addEventListener('input', function() {
        bpmDisplay.textContent = this.value;
        if (metronomeRunning) {
          stopMetronome();
          startMetronome();
        }
      });

      btnMetronome.addEventListener('click', function() {
        // Ensure audio context is created on user gesture
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        
        if (metronomeRunning) {
          stopMetronome();
        } else {
          startMetronome();
        }
      });

      function startMetronome() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        var bpm = parseInt(bpmSlider.value);
        var interval = 60000 / bpm;
        
        metronomeRunning = true;
        btnMetronome.innerHTML = '<span>⏹</span> 停止';
        
        playClick();
        
        metronomeTimer = setInterval(function() {
          currentBeat = (currentBeat + 1) % 4;
          playClick();
        }, interval);
      }

      function stopMetronome() {
        metronomeRunning = false;
        btnMetronome.innerHTML = '<span>🎵</span> 节拍器';
        clearInterval(metronomeTimer);
        metronomeTimer = null;
        beatDots.forEach(function(dot) { dot.classList.remove('active'); });
      }

      function playClick() {
        beatDots.forEach(function(dot, i) {
          dot.classList.toggle('active', i === currentBeat);
        });
        
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.value = currentBeat === 0 ? 1000 : 800;
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      }

      // Lick Player
      var LICKS = {
        1: { name: '上行音阶', notes: [[0,0],[0,3],[1,0],[1,2],[2,0],[2,2],[3,0],[3,2],[4,1],[4,3],[5,0],[5,3]] },
        2: { name: '下行音阶', notes: [[5,3],[5,0],[4,3],[4,1],[3,2],[3,0],[2,2],[2,0],[1,2],[1,0],[0,3],[0,0]] },
        3: { name: '跳跃音符', notes: [[0,0],[2,2],[1,0],[3,2],[0,3],[4,1],[1,2],[5,0]] },
        4: { name: '锤勾弦组合', notes: [[0,0],[0,3],[0,0],[1,0],[1,2],[1,0],[2,0],[2,2],[2,0],[3,0],[3,2],[3,0]] }
      };

      document.querySelectorAll('.lick-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          // Ensure audio context is created on user gesture
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          
          var lickId = this.dataset.lick;
          var lick = LICKS[lickId];
          if (!lick) return;
          
          if (metronomeTimer) stopMetronome();
          
          lickDisplay.textContent = '▶ 播放: ' + lick.name + '\n' + 
            lick.notes.map(function(n) {
              var strings = ['6弦','5弦','4弦','3弦','2弦','1弦'];
              var notes = ['E','F','F#','G','G#','A','A#','B','C','C#','D','D#'];
              var string = strings[n[0]];
              var fret = n[1];
              var note = notes[(['E','A','D','G','B','E'].indexOf(['E','A','D','G','B','E'][n[0]]) + fret) % 12];
              return string + fret + '品(' + note + ')';
            }).join(' → ');
          
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          
          var dur = 60000 / 90;
          lick.notes.forEach(function(n, i) {
            setTimeout(function() {
              var osc = audioCtx.createOscillator();
              var gain = audioCtx.createGain();
              osc.type = 'triangle';
              
              var freqs = [82.41, 110.00, 146.83, 196.00, 246.94, 329.63];
              osc.frequency.value = freqs[n[0]] * Math.pow(2, n[1]/12);
              
              gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start();
              osc.stop(audioCtx.currentTime + 0.25);
            }, i * dur);
          });
        });
      });

      // Render practice fretboard
      function renderPracticeFretboard() {
        var el = document.getElementById('practiceFretboard');
        if (!el || !window.renderFretboard) return;
        
        window.renderFretboard(el, {
          numFrets: 4,
          startFret: 0,
          showLabels: true,
          notes: [
            { string: 0, fret: 0, label: 'R', color: '#e63946' },
            { string: 0, fret: 3, label: '♭3', color: '#457b9d' },
            { string: 1, fret: 0, label: '4', color: '#2ec4b6' },
            { string: 1, fret: 2, label: '5', color: '#ff9f1c' },
            { string: 2, fret: 0, label: '♭7', color: '#7b2cbf' },
            { string: 2, fret: 2, label: 'R', color: '#e63946' },
            { string: 3, fret: 0, label: '♭3', color: '#457b9d' },
            { string: 3, fret: 2, label: '4', color: '#2ec4b6' },
            { string: 4, fret: 1, label: '5', color: '#ff9f1c' },
            { string: 4, fret: 3, label: '♭7', color: '#7b2cbf' },
            { string: 5, fret: 0, label: 'R', color: '#e63946' },
            { string: 5, fret: 3, label: '♭3', color: '#457b9d' }
          ],
          width: el.offsetWidth,
          height: 180
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderPracticeFretboard);
      } else {
        renderPracticeFretboard();
      }
    })();
  </script>
</body>
</html>
